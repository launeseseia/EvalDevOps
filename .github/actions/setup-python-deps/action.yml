name: "Setup Python + dependances"
description: "Installe Python, restaure le cache pip et installe les dependances du projet"

inputs:
  python-version:
    description: "Version de Python a installer"
    required: false
    default: "3.12"
  requirements:
    description: "Fichier de dependances a installer"
    required: false
    default: "requirements.txt"
  extra-packages:
    description: "Paquets supplementaires (separes par des espaces)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles(inputs.requirements) }}

    - name: Install dependencies
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        pip install -r "$REQUIREMENTS"
        if [ -n "$EXTRA_PACKAGES" ]; then
          pip install $EXTRA_PACKAGES
        fi
