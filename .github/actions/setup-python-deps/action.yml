name: "Setup Python + dependances"
description: "Installe Python, restaure le cache pip et installe les dependances"

inputs:
  python-version:
    description: "Version de Python a installer"
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt
