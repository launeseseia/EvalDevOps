name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        type: choice
        options: [production]
        default: production
        required: true

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout du commit valide par la CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Calcul des tags
        id: meta
        env:
          FULL_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${FULL_SHA::7}"
          SEMVER="$(tr -d '[:space:]' < VERSION).${RUN_NUMBER}"
          {
            echo "image=${IMAGE}"
            echo "sha_tag=${SHORT_SHA}"
            echo "full_sha=${FULL_SHA}"
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${SHORT_SHA}"
            echo "${IMAGE}:${SEMVER}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags : latest, ${SHORT_SHA}, ${SEMVER}"

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            COMMIT_SHA=${{ steps.meta.outputs.full_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ inputs.environment || 'production' }})
    needs: build-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: http://localhost:8080/status
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-push.outputs.image }}
      NEW_TAG: ${{ needs.build-push.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy, healthcheck, rollback
        run: bash deploy/deploy.sh
