name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  Lint:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python + dependances
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.10"

      - name: Run linter (flake8)
        run: flake8 . --max-line-length=100 --exclude=.venv

  Yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer yamllint
        run: pip install yamllint==1.35.1
      - name: Lancer yamllint
        run: yamllint .

  Test:
    runs-on: ubuntu-latest
    needs: Lint
    timeout-minutes: 10
    env:
      REDIS_HOST: localhost
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python + dependances
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests (pytest)
        run: pytest -v --cov=. --cov-report=html:rapport.html

      - name: Upload artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-${{ matrix.python-version }}
          path: rapport.html

  Build:
    runs-on: ubuntu-latest
    needs: Lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t eval-devops:${{ github.sha }} .

  Ci-ok:
    name: Ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [Lint, Yamllint, Test, Build]
    if: always()
    steps:
      - name: Verification des jobs precedents
        run: |
          echo "Lint     : ${{ needs.lint.result }}"
          echo "Yamllint : ${{ needs.yamllint.result }}"
          echo "Test     : ${{ needs.test.result }}"
          echo "Build    : ${{ needs.build.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.yamllint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Un ou plusieurs jobs requis ont echoue."
            exit 1
          fi
          echo "Tous les jobs amont ont reussi."
