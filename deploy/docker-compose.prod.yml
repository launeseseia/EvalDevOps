services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE doit etre defini}
    container_name: eval-devops-prod-app
    ports:
      - "8080:5000"
    environment:
      - REDIS_HOST=redis
    networks:
      - prod-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eval-devops-prod-redis
    volumes:
      - redis-prod-data:/data
    networks:
      - prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  prod-net:

volumes:
  redis-prod-data:
