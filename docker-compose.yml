services:
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eval-devops-app
    ports:
      - "5000:5000"
    environment:
      - COMMIT_SHA=${COMMIT_SHA:-unknown}
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s  
  
  redis:
    image: redis:7-alpine
    container_name: redis-service
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

