groups:
  - name: application
    rules:
      - alert: TauxErreurEleve
        expr: >
          sum(rate(http_requests_total{code=~"5.."}[1m]))
          / sum(rate(http_requests_total[1m])) > 0.05
        for: 30s
        labels:
          severity: warning

      - alert: ApplicationInjoignable
        expr: up{job="flask-app"} == 0
        for: 15s
        labels:
          severity: critical

      - alert: LatenceP95Degradee
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, endpoint) (
              rate(http_request_duration_seconds_bucket{job="flask-app"}[5m])
            )
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 superieure a 500 ms sur {{ $labels.endpoint }}"
